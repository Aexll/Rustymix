[package]
name = "rustymix"
version = "0.1.0"
edition = "2024"
description = "Application de mix DJ : deux platines, EQ, filtre, stems, transitions automatiques en nœuds"
repository = "https://github.com/Aexll/Rustymix"
license-file = "LICENSE"
readme = "README.md"
build = "build.rs"

[dependencies]
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = { version = "0.37.0", features = ["glow"] }
egui = "0.37.0"
egui_extras = "0.37.0"
lofty = "0.25.5"
rfd = "0.18.0"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["all"] }
toml = "1.2.1"
ureq = { version = "3.5.2", features = ["json"] }
walkdir = "2.5.0"

# Le DSP et le décodage doivent rester rapides même avec `cargo run` :
# les dépendances sont toujours optimisées, le code de l'application un peu.
# Icône de l'exécutable Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
